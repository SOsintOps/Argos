name: Checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats jq
      - name: ShellCheck
        run: shellcheck -x -P launchers setup.sh launchers/*.sh launchers/lib/argos.sh multimedia/wallpapers/set-wallpaper.sh
      - name: Tests
        run: bats tests/
